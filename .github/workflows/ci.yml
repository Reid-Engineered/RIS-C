name: Rust simulator
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/platform_check.py --output platform.json
      - run: python3 scripts/check_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-${{ runner.os }}
          path: platform.json
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -v
      - if: runner.os == 'Linux'
        # Checked-in snapshots are imported separately from oracle artifacts.
        # Validate their integrity here; the oracle job executes current sources.
        run: python3 scripts/parity.py --check --allow-stale
      - if: runner.os == 'Linux'
        run: python3 scripts/expansion.py --check --allow-stale
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/build-reference.sh
      - run: python3 scripts/parity.py --run
        env:
          NGSPICE_BIN: ${{ github.workspace }}/reference/build/src/ngspice
      - run: python3 scripts/expansion.py --run
        env:
          NGSPICE_BIN: ${{ github.workspace }}/reference/build/src/ngspice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-parity-report
          path: |
            docs/PARITY.md
            docs/EXPANSION.md
            reports/
